[project]
  name = "optlib"
  version = "0.1.0"
  description = "Options pricing, volatility surface, and risk toolkit"
  requires-python = ">=3.11"
  dependencies = ["numpy", "scipy", "pandas", "requests"]

  [project.optional-dependencies]
  plots = ["matplotlib"]

  [dependency-groups]
  dev = ["pytest", "ruff"]

  [build-system]
  requires = ["hatchling"]
  build-backend = "hatchling.build"

  [tool.hatch.build.targets.wheel]
  packages = ["src/optlib"]

  [tool.ruff]
  line-length = 100

  [tool.ruff.lint]
  # E/F: errors and Python mistakes, I: import order, B: likely bugs, C4: comprehensions
  select = ["E", "F", "I", "B", "C4"]

  [tool.pytest.ini_options]
  testpaths = ["tests"]